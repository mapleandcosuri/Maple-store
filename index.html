<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maple & Co. — Pre-Loved Fashion Boutique</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F8F3ED',
                        'cream-card': '#FFFFFF',
                        terracotta: '#98694B',
                        wood: '#2C1E18',
                        'autumn-green': '#5B6846',
                        'autumn-green-hover': '#495437',
                        sand: '#EFE8DE',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #F8F3ED;
            color: #2C1E18;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Custom SVG Maple Leaf Floating Background Decorations */
        .leaf-decor {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            filter: drop-shadow(0 12px 18px rgba(44, 30, 24, 0.15));
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .leaf-left {
            top: 20px;
            left: -40px;
            width: 180px;
            transform: rotate(-15deg);
        }

        .leaf-right {
            top: 60px;
            right: -30px;
            width: 210px;
            transform: rotate(25deg);
        }

        @media (min-width: 768px) {
            .leaf-left {
                left: 10px;
                width: 260px;
            }
            .leaf-right {
                right: 20px;
                width: 290px;
            }
        }

        /* Smooth cards hover */
        .product-card {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -10px rgba(152, 105, 75, 0.18);
        }

        /* Active tab styling */
        .category-tab.active {
            background-color: #5B6846;
            color: #FFFFFF;
            border-color: #5B6846;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F8F3ED;
        }
        ::-webkit-scrollbar-thumb {
            background: #98694B;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen relative pb-16">

    <!-- DECORATIVE MAPLE LEAVES (Placeholders for real leaf PNG images with transparent backgrounds) -->
    <!-- Reemplaza AQUÍ_VA_EL_ENLACE_DE_TU_HOJA_IZQ con la URL de tu imagen de hojas izquierdas -->
    <img 
        src="AQUÍ_VA_EL_ENLACE_DE_TU_HOJA_IZQ" 
        alt="Hojas de Maple Decorativas" 
        class="leaf-decor leaf-left"
        onerror="this.style.display='none';" 
    />

    <!-- Reemplaza AQUÍ_VA_EL_ENLACE_DE_TU_HOJA_DER con la URL de tu imagen de hojas derechas -->
    <img 
        src="AQUÍ_VA_EL_ENLACE_DE_TU_HOJA_DER" 
        alt="Hojas de Maple Decorativas" 
        class="leaf-decor leaf-right"
        onerror="this.style.display='none';" 
    />

    <!-- MAIN CONTAINER -->
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">

        <!-- HEADER / HERO SECTION -->
        <header class="text-center py-10 relative z-20">
            <p class="text-xs sm:text-sm tracking-[0.25em] text-terracotta font-semibold uppercase mb-6">
                Curated with care · Loved again
            </p>
            
            <!-- BRAND LOGO PLACEHOLDER -->
            <div class="inline-flex flex-col items-center justify-center">
                <!-- Reemplaza AQUÍ_VA_EL_ENLACE_DE_TU_LOGO con la URL oficial de tu logo de Maple & Co. -->
                <img 
                    src="AQUÍ_VA_EL_ENLACE_DE_TU_LOGO" 
                    alt="Maple & Co. Logo" 
                    class="h-28 sm:h-36 w-auto object-contain mx-auto mb-4 drop-shadow-sm"
                    onerror="this.onerror=null; this.src='https://placehold.co/300x120/F8F3ED/98694B?text=MAPLE+%26+CO.';"
                />
            </div>

            <p class="mt-6 max-w-xl mx-auto text-wood/80 text-sm sm:text-base font-light leading-relaxed px-4">
                Piezas únicas, elegidas minuciosamente para acompañarte en tu propio estilo. Descubre prendas especiales que merecen continuar su historia contigo.
            </p>
        </header>

        <!-- SEARCH BAR & CATEGORIES -->
        <section class="mt-4 mb-10 relative z-20">
            <!-- Search Input -->
            <div class="max-w-md mx-auto mb-6">
                <div class="relative">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Buscar prendas por nombre o estilo..." 
                        class="w-full pl-11 pr-4 py-3 bg-white border border-terracotta/30 rounded-full text-sm text-wood placeholder-terracotta/50 focus:outline-none focus:ring-2 focus:ring-terracotta/40 transition shadow-sm"
                    >
                    <svg class="w-5 h-5 text-terracotta/60 absolute left-4 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
            </div>

            <!-- Filter Buttons -->
            <div class="flex flex-wrap justify-center gap-2 sm:gap-3" id="categoryFilters">
                <button onclick="filterCategory('todos')" class="category-tab active px-5 py-2 rounded-full text-xs font-semibold uppercase tracking-wider border border-terracotta/30 text-terracotta bg-white transition hover:border-autumn-green">
                    Todos
                </button>
                <button onclick="filterCategory('vestidos')" class="category-tab px-5 py-2 rounded-full text-xs font-semibold uppercase tracking-wider border border-terracotta/30 text-terracotta bg-white transition hover:border-autumn-green">
                    Vestidos
                </button>
                <button onclick="filterCategory('blusas')" class="category-tab px-5 py-2 rounded-full text-xs font-semibold uppercase tracking-wider border border-terracotta/30 text-terracotta bg-white transition hover:border-autumn-green">
                    Blusas & Tops
                </button>
                <button onclick="filterCategory('pantalones')" class="category-tab px-5 py-2 rounded-full text-xs font-semibold uppercase tracking-wider border border-terracotta/30 text-terracotta bg-white transition hover:border-autumn-green">
                    Pantalones
                </button>
                <button onclick="filterCategory('abrigos')" class="category-tab px-5 py-2 rounded-full text-xs font-semibold uppercase tracking-wider border border-terracotta/30 text-terracotta bg-white transition hover:border-autumn-green">
                    Abrigos & Blazers
                </button>
            </div>
        </section>

        <!-- PRODUCT CATALOG GRID -->
        <section id="catalogGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 relative z-20">
            <!-- Products injected by JavaScript -->
        </section>

        <!-- EMPTY STATE MESSAGE -->
        <div id="noResults" class="hidden text-center py-16">
            <p class="font-serif text-xl text-wood/70">No encontramos piezas que coincidan con tu búsqueda.</p>
            <button onclick="resetSearch()" class="mt-4 text-xs font-semibold uppercase tracking-widest text-terracotta underline">
                Ver todo el catálogo
            </button>
        </div>

    </div>

    <!-- FOOTER -->
    <footer class="mt-20 text-center text-xs text-wood/60 py-6 border-t border-terracotta/20 relative z-20">
        <p>© <span id="year"></span> Maple & Co. — Piezas únicas pre-loved seleccionadas con amor.</p>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Configura aquí tu número oficial de WhatsApp con código de país
        const WHATSAPP_PHONE = "5978800000"; 

        // CATALOG DATABASE 
        // Reemplaza las URLs 'image' por los enlaces directos de las fotos de tu ropa pre-loved.
        const products = [
            {
                id: 1,
                name: "Vestido Clásico Beige Lino",
                category: "vestidos",
                price: "790 SRD",
                condition: "Excelente Estado · Pre-loved",
                size: "Talla M (Medidas: Busto 92cm | Largo 110cm)",
                image: "AQUÍ_VA_EL_ENLACE_DE_LA_FOTO_DEL_PRODUCTO_1"
            },
            {
                id: 2,
                name: "Pantalón Tailored Corte Recto",
                category: "pantalones",
                price: "850 SRD",
                condition: "Muy Buen Estado · Pre-loved",
                size: "Talla S (Medidas: Cintura 68cm | Cadera 94cm)",
                image: "AQUÍ_VA_EL_ENLACE_DE_LA_FOTO_DEL_PRODUCTO_2"
            },
            {
                id: 3,
                name: "Blusa Seda Marfil Botones Vintage",
                category: "blusas",
                price: "590 SRD",
                condition: "Excelente Estado · Pre-loved",
                size: "Talla S/M (Medidas: Busto 96cm | Largo 62cm)",
                image: "AQUÍ_VA_EL_ENLACE_DE_LA_FOTO_DEL_PRODUCTO_3"
            },
            {
                id: 4,
                name: "Trench Coat Otoño Camel",
                category: "abrigos",
                price: "1,250 SRD",
                condition: "Como Nuevo · Pre-loved",
                size: "Talla M (Medidas: Hombros 42cm | Largo 105cm)",
                image: "AQUÍ_VA_EL_ENLACE_DE_LA_FOTO_DEL_PRODUCTO_4"
            }
        ];

        let currentCategory = 'todos';

        // Render Product Cards
        function renderProducts(items) {
            const grid = document.getElementById('catalogGrid');
            const noResults = document.getElementById('noResults');

            if (items.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');

            grid.innerHTML = items.map(product => {
                const whatsappMessage = encodeURIComponent(
                    `Hola Maple & Co., estoy interesada en la pieza única "${product.name}" (Precio: ${product.price}). ¿Sigue disponible?`
                );
                const whatsappUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${whatsappMessage}`;

                // Fallback placeholder image if url is empty or invalid
                const displayImage = (product.image && !product.image.includes("AQUÍ_VA_EL_ENLACE")) 
                    ? product.image 
                    : `https://placehold.co/600x800/EFE8DE/98694B?text=${encodeURIComponent(product.name)}`;

                return `
                    <article class="product-card bg-cream-card rounded-2xl overflow-hidden border border-terracotta/20 flex flex-col justify-between shadow-sm">
                        <div>
                            <!-- IMAGE & BADGE -->
                            <div class="relative aspect-[3/4] overflow-hidden bg-sand">
                                <img 
                                    src="${displayImage}" 
                                    alt="${product.name}"
                                    class="w-full h-full object-cover transition-transform duration-700 hover:scale-105"
                                    loading="lazy"
                                    onerror="this.src='https://placehold.co/600x800/EFE8DE/98694B?text=Foto+Prenda';"
                                />
                                <span class="absolute top-3 left-3 bg-autumn-green text-white text-[10px] font-bold uppercase tracking-widest px-3 py-1.5 rounded-full shadow-sm">
                                    Pieza Única
                                </span>
                            </div>

                            <!-- DETAILS -->
                            <div class="p-5">
                                <h3 class="font-serif text-xl font-semibold text-wood leading-snug">
                                    ${product.name}
                                </h3>
                                
                                <p class="text-lg font-bold text-terracotta mt-2">
                                    ${product.price}
                                </p>

                                <div class="mt-3 pt-3 border-t border-terracotta/10 space-y-1.5">
                                    <p class="text-xs text-wood/70 flex items-center gap-1.5">
                                        <span class="w-2 h-2 rounded-full bg-autumn-green inline-block"></span>
                                        ${product.condition}
                                    </p>
                                    <p class="text-xs font-medium text-wood/90 bg-cream/70 p-2 rounded-lg border border-terracotta/10">
                                        📌 ${product.size}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- ACTION BUTTON -->
                        <div class="p-5 pt-0">
                            <a 
                                href="${whatsappUrl}" 
                                target="_blank"
                                rel="noopener noreferrer"
                                class="w-full bg-autumn-green hover:bg-autumn-green-hover text-white py-3 px-4 rounded-xl font-medium text-xs uppercase tracking-wider flex items-center justify-center gap-2 transition shadow-sm"
                            >
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-0.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                                </svg>
                                Pedir por WhatsApp
                            </a>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // Filter Logic by Category
        function filterCategory(category) {
            currentCategory = category;
            
            // Update UI Tab Styles
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            applyFilters();
        }

        // Apply Search and Category Filters simultaneously
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = products.filter(product => {
                const matchesCategory = currentCategory === 'todos' || product.category === currentCategory;
                const matchesSearch = product.name.toLowerCase().includes(searchTerm) || 
                                      product.size.toLowerCase().includes(searchTerm) ||
                                      product.condition.toLowerCase().includes(searchTerm);

                return matchesCategory && matchesSearch;
            });

            renderProducts(filtered);
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            filterCategory('todos');
        }

        // Search Input Listener
        document.getElementById('searchInput').addEventListener('input', applyFilters);

        // Initial Load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').innerText = new Date().getFullYear();
            renderProducts(products);
        });
    </script>
</body>
</html>
